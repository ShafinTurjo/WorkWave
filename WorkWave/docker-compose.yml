services:
  workwave-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: workwave-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - workwave-db-data:/var/opt/mssql
    restart: unless-stopped

volumes:
  workwave-db-data:
