<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WorkWave - Find & Post Jobs</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="Frontend.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Custom Splash Screen (shown until Blazor WASM finishes loading) -->
        <div id="splash-screen">
            <div class="splash-content">
                <div class="splash-logo">
                    <span class="splash-logo-icon"><i class="bi bi-briefcase-fill"></i></span>
                    <span class="splash-logo-text">Work<span class="accent">Wave</span></span>
                </div>
                <div class="splash-bar">
                    <div class="splash-bar-fill"></div>
                </div>
                <p class="splash-tagline">Connecting talent with opportunity...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webassembly#[.{fingerprint}].js" autostart="false"></script>
    <script>
        // Hide splash screen once Blazor has fully started
        Blazor.start().then(function () {
            var splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('splash-hide');
                setTimeout(function () { splash.remove(); }, 500);
            }
        });
    </script>
</body>

</html>
