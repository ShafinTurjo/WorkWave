name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "WorkWave/Frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Project page URL = https://<user>.github.io/<repo>/  -> base path must be /<repo>/
      BASE_PATH: /${{ github.event.repository.name }}/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Blazor WebAssembly
        run: dotnet publish WorkWave/Frontend/Frontend.csproj -c Release -o release

      - name: Rewrite <base href> for GitHub Pages sub-path
        run: |
          sed -i "s|<base href=\"/\" */>|<base href=\"${BASE_PATH}\" />|" release/wwwroot/index.html
          grep '<base href' release/wwwroot/index.html
          grep -q "<base href=\"${BASE_PATH}\"" release/wwwroot/index.html

      - name: SPA fallback (deep links like /login, /verify-email?token=...)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - name: Disable Jekyll (needed so the _framework folder is served)
        run: touch release/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
